[project]
name = "mirror-plugin-statistics"
version = "0.1.0"
description = "mirror.py status plug-in: measure and track per-repository disk usage over time."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "mirror.py contributors" },
]
keywords = ["mirror", "statistics", "disk-usage", "plugin"]
dependencies = [
    "mirror.py>=1.3.0",
    "click>=8.1",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.entry-points."mirror.status"]
statistics = "mirror_plugin_statistics:plugin"

[project.scripts]
mirror-statistics = "mirror_plugin_statistics.cli:main"

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that require a live daemon (deselected by default)",
    "unit: fast in-process unit tests (default selection)",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mirror_plugin_statistics*"]
